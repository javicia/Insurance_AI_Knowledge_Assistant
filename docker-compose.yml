name: insurance-knowledge-assistant

networks:
  insurance-ai-net:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  keycloak-data:

services:
  keycloak:
    # FASE 17 (IAM): a real, self-contained OIDC identity provider - PoC-labeled (dev mode,
    # HTTP, no TLS termination), not a hand-rolled auth mechanism (brief section: "No implementes
    # autenticacion casera"). Realm/clients/roles/test users are declaratively imported from
    # infra/keycloak/realm-export.json at startup, not clicked together by hand, so this
    # environment is reproducible. See docs/security/IAM_ARCHITECTURE.md.
    image: quay.io/keycloak/keycloak:26.0
    container_name: insurance-ai-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "8180:8080"
    networks:
      - insurance-ai-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Empirically measured, not guessed: Keycloak's own Quarkus "build" phase (triggered by
      # --import-realm on first start) was observed taking up to ~10.5 minutes on this project's
      # development machine (Windows/Docker Desktop/WSL2, slow small-file I/O during that phase -
      # see docs/adr/ADR-015-IAM-OAUTH2-OIDC.md and KeycloakJwtValidationTest's own Testcontainers
      # startup timeout, measured the same way).
      #
      # FASE 23 re-measurement (KeycloakJwtValidationTest, run in isolation): a real, eventually-
      # successful startup on this same machine took 685.8s (~11.4 min) total, with the Quarkus
      # augmentation phase alone measured at 594151ms via Keycloak's own log line - past the
      # previous 12-minute margin's safety buffer. 15 minutes restores real margin above this
      # newer, larger measurement (see KeycloakJwtValidationTest's own Javadoc for the identical
      # evidence).
      start_period: 900s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: insurance-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance_ai}
      POSTGRES_USER: ${POSTGRES_USER:-insurance_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insurance_ai}
    ports:
      # Mapped to a non-default host port to avoid colliding with other local Postgres
      # instances; the container's own network still uses the standard 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - insurance-ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insurance_ai} -d ${POSTGRES_DB:-insurance_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    # FASE 34 (container hardening): pinned, not :latest - reproducible builds, no surprise
    # upgrades on a fresh `docker compose pull`.
    image: apache/kafka:4.3.1
    container_name: insurance-ai-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is used by other containers on insurance-ai-net (e.g. kafka-ui); EXTERNAL is
      # used by the Spring Boot application when it runs on the host via ./mvnw spring-boot:run.
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Document-ingestion topics (insurance.document.uploaded/processed/embedded) are not
      # created by any code yet (FASE 4) - auto-creation only matters for this phase's
      # connectivity checks, which use their own throwaway topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - insurance-ai-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    # FASE 34: pinned, not :latest.
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: insurance-ai-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: insurance-ai
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"
    networks:
      - insurance-ai-net
    depends_on:
      kafka:
        condition: service_healthy

  # FASE 25 (Distributed Tracing): the OpenTelemetry Collector - the single point every
  # application's OTLP exporter dependency stops at (never a direct Jaeger/vendor SDK dependency
  # in backend/gateway code). Jaeger all-in-one is the local trace-storage/visualization backend
  # for this PoC - swappable in infra/otel/otel-collector-config.yaml alone for a real deployment
  # (Tempo/Honeycomb/Datadog/a SIEM's trace ingestion), with zero application code change. See
  # docs/observability/DISTRIBUTED_TRACING.md.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: insurance-ai-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      # Published for direct developer access (a local script/tool exporting spans without going
      # through the full stack) - real traffic in this topology always originates from
      # backend/gateway on the internal Docker network.
      - "4318:4318" # OTLP/HTTP
      - "4317:4317" # OTLP/gRPC
      - "5514:5514/udp" # syslog (FASE B, security-events log pipeline)
      - "13133:13133" # health_check extension - see the honest healthcheck note below
    networks:
      - insurance-ai-net
    depends_on:
      jaeger:
        condition: service_started
    # No Docker-level HEALTHCHECK on this specific service, and that is a verified fact, not an
    # oversight: `otel/opentelemetry-collector-contrib` is a distroless-style image with no shell
    # and no curl/wget (confirmed by attempting `docker run --entrypoint sh` against it - it fails
    # with "executable file not found in $PATH"), so a `CMD-SHELL curl ...` healthcheck genuinely
    # cannot run inside this container the way every other service's healthcheck does. The
    # `health_check` extension (otel-collector-config.yaml) still provides a *real*, externally
    # verifiable health endpoint (`curl http://localhost:13133/health` from the host or from
    # another container that has curl, e.g. `docker compose exec waf curl -s
    # http://otel-collector:13133/health`) - this service is correctly reported by `docker compose
    # ps` as "Up" without a health column, the same honest category `kafka-ui` already uses, not
    # silently presented as "healthy".
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  jaeger:
    # All-in-one: in-memory trace storage, real for this PoC's demonstration purpose (a
    # restart loses trace history) - a production deployment would point Jaeger at a real
    # storage backend (Elasticsearch/Cassandra) instead, out of scope here. Accepts OTLP
    # natively (no separate Jaeger-protocol exporter/agent needed anywhere in this stack).
    image: jaegertracing/all-in-one:1.76.0
    container_name: insurance-ai-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      # Jaeger UI - real browser-facing trace visualization for this PoC's demonstration
      # purpose only, not routed through the WAF (an internal observability tool, not a
      # customer/employee-facing surface).
      - "16686:16686"
    networks:
      - insurance-ai-net
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:16686/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # FASE 16 (frontend/backend separation, ADR-014): three independently built/deployed
  # services replace the former single combined `insurance-ai` image - backend, gateway, and
  # frontend each have their own Dockerfile and share no build, no artifact, no source. The
  # browser talks to `frontend` for static assets and to `gateway` for every API call
  # (PUBLIC_API_BASE_URL, injected at frontend container startup) - it never talks to `backend`
  # directly in this topology.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insurance-ai-backend
    restart: unless-stopped
    environment:
      # Internal-network hostnames/ports (postgres:5432, kafka:9092) - never the host-mapped
      # 5433/9094 used by tools running outside this compose network.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-insurance_ai}
      POSTGRES_USER: ${POSTGRES_USER:-insurance_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insurance_ai}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Defaults to the deterministic fake provider - no real OpenAI/Anthropic credentials
      # required to run the full product end to end. Override via a real .env for a real provider.
      INSURANCE_AI_PROVIDER: ${INSURANCE_AI_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-configured}
      # FASE 17 (IAM): internal Docker network address for fetching signing keys - deliberately
      # NOT the same value as INSURANCE_AI_OIDC_ISSUER, see
      # InsuranceAiProperties.Security.OAuth2's Javadoc for why the two must differ here.
      INSURANCE_AI_OIDC_JWK_SET_URI: http://keycloak:8080/realms/insurance-ai/protocol/openid-connect/certs
      # The browser-facing address - identical to what Keycloak actually prints into every
      # token's iss claim, since that reflects whatever URL obtained the token in the first place.
      INSURANCE_AI_OIDC_ISSUER: ${INSURANCE_AI_OIDC_ISSUER:-http://localhost:8180/realms/insurance-ai}
      # FASE 25: internal Docker network address of the collector - the OTLP exporter is
      # resilient to a temporarily unavailable collector (buffers/drops, never blocks or crashes
      # the application), so this is not a `condition: service_healthy` dependency below.
      INSURANCE_AI_OTLP_ENDPOINT: http://otel-collector:4318
      # FASE B (SIEM pipeline): where SECURITY_EVENTS_SYSLOG (logback-spring.xml) ships the
      # security-events logger - same resilience note as the OTLP endpoint above (Logback's
      # SyslogAppender is fire-and-forget UDP).
      INSURANCE_AI_OTEL_SYSLOG_HOST: otel-collector
      INSURANCE_AI_OTEL_SYSLOG_PORT: "5514"
    ports:
      # Published for direct developer access (Swagger UI, curl) - real network segmentation
      # (removing this and routing every external call through the gateway/WAF only) is FASE 40's
      # concern, see docs/architecture/NETWORK_SEGMENTATION.md.
      - "8080:8080"
    networks:
      - insurance-ai-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    # FASE 34 (container hardening): a JVM with no memory ceiling can consume the whole host -
    # respected by `docker compose up` (Compose Specification, no swarm required).
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: insurance-ai-gateway
    restart: unless-stopped
    environment:
      INSURANCE_AI_BACKEND_URI: http://backend:8080
      # The browser-facing origin, as the browser itself reports it in `Origin` - which since
      # FASE 20 is the WAF (:8000), the one public edge, NOT the frontend container's own
      # host-mapped port.
      #
      # FASE 26 incident: this was `http://localhost:8083` (the frontend's direct port), left over
      # from the pre-WAF topology. A browser loading the SPA from the WAF sends
      # `Origin: http://localhost:8000` on its API calls, Spring's CORS filter rejected it, and
      # every write from the real UI failed with **403** - while the API itself was perfectly
      # healthy. It stayed invisible because curl and Playwright's API client send no `Origin`
      # header at all, so every non-browser check passed; only a real browser reproduces it.
      # ModSecurity was ruled out as the source by its own audit log (`is_interrupted: false`,
      # empty `messages`), and the 403 carried `Vary: Origin` - the CORS filter's fingerprint.
      INSURANCE_AI_ALLOWED_ORIGIN: ${INSURANCE_AI_ALLOWED_ORIGIN:-http://localhost:8000}
      # FASE 19: the gateway independently validates JWTs too (defense in depth) - same internal/
      # external URL split as the backend, see docs/security/IAM_ARCHITECTURE.md section 2.
      INSURANCE_AI_OIDC_JWK_SET_URI: http://keycloak:8080/realms/insurance-ai/protocol/openid-connect/certs
      INSURANCE_AI_OIDC_ISSUER: ${INSURANCE_AI_OIDC_ISSUER:-http://localhost:8180/realms/insurance-ai}
      INSURANCE_AI_OTLP_ENDPOINT: http://otel-collector:4318
      INSURANCE_AI_OTEL_SYSLOG_HOST: otel-collector
      INSURANCE_AI_OTEL_SYSLOG_PORT: "5514"
    ports:
      - "8082:8082"
    networks:
      - insurance-ai-net
    depends_on:
      backend:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insurance-ai-frontend
    restart: unless-stopped
    environment:
      # FASE 20: the browser now reaches the API through the WAF (the one public edge), not the
      # gateway directly - see waf/ and docs/adr/ADR-016-WAF-EDGE.md. Still overridable for a
      # topology that deliberately bypasses the WAF during development.
      PUBLIC_API_BASE_URL: ${INSURANCE_AI_PUBLIC_API_BASE_URL:-http://localhost:8000}
      PUBLIC_OIDC_ISSUER: ${INSURANCE_AI_OIDC_ISSUER:-http://localhost:8180/realms/insurance-ai}
      PUBLIC_OIDC_CLIENT_ID: insurance-ai-frontend
    ports:
      # Published for direct developer access - real browser traffic goes through the WAF
      # (port 8000) once it is up, per the edge topology below.
      - "8083:8080"
    networks:
      - insurance-ai-net
    depends_on:
      gateway:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  # FASE 20/21: the single browser-facing edge (real ModSecurity + OWASP CRS, not a hand-rolled
  # filter) - see waf/Dockerfile and docs/adr/ADR-016-WAF-EDGE.md for why it routes by path to
  # both the frontend and the gateway rather than only sitting in front of the gateway.
  waf:
    build:
      context: ./waf
      dockerfile: Dockerfile
    container_name: insurance-ai-waf
    restart: unless-stopped
    environment:
      API_BACKEND: http://gateway:8082
      FRONTEND_BACKEND: http://frontend:8080
    ports:
      - "8000:8080"
    networks:
      - insurance-ai-net
    depends_on:
      gateway:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

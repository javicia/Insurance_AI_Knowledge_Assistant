name: insurance-knowledge-assistant

networks:
  insurance-ai-net:
    driver: bridge

volumes:
  postgres-data:
  kafka-data:
  keycloak-data:

services:
  keycloak:
    # FASE 17 (IAM): a real, self-contained OIDC identity provider - PoC-labeled (dev mode,
    # HTTP, no TLS termination), not a hand-rolled auth mechanism (brief section: "No implementes
    # autenticacion casera"). Realm/clients/roles/test users are declaratively imported from
    # infra/keycloak/realm-export.json at startup, not clicked together by hand, so this
    # environment is reproducible. See docs/security/IAM_ARCHITECTURE.md.
    image: quay.io/keycloak/keycloak:26.0
    container_name: insurance-ai-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      - keycloak-data:/opt/keycloak/data
    ports:
      - "8180:8080"
    networks:
      - insurance-ai-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 45s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: insurance-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-insurance_ai}
      POSTGRES_USER: ${POSTGRES_USER:-insurance_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insurance_ai}
    ports:
      # Mapped to a non-default host port to avoid colliding with other local Postgres
      # instances; the container's own network still uses the standard 5432.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - insurance-ai-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insurance_ai} -d ${POSTGRES_DB:-insurance_ai}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  kafka:
    image: apache/kafka:latest
    container_name: insurance-ai-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNAL is used by other containers on insurance-ai-net (e.g. kafka-ui); EXTERNAL is
      # used by the Spring Boot application when it runs on the host via ./mvnw spring-boot:run.
      KAFKA_LISTENERS: CONTROLLER://:9093,INTERNAL://:9092,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Document-ingestion topics (insurance.document.uploaded/processed/embedded) are not
      # created by any code yet (FASE 4) - auto-creation only matters for this phase's
      # connectivity checks, which use their own throwaway topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - insurance-ai-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: insurance-ai-kafka-ui
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: insurance-ai
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8081:8080"
    networks:
      - insurance-ai-net
    depends_on:
      kafka:
        condition: service_healthy

  # FASE 16 (frontend/backend separation, ADR-014): three independently built/deployed
  # services replace the former single combined `insurance-ai` image - backend, gateway, and
  # frontend each have their own Dockerfile and share no build, no artifact, no source. The
  # browser talks to `frontend` for static assets and to `gateway` for every API call
  # (PUBLIC_API_BASE_URL, injected at frontend container startup) - it never talks to `backend`
  # directly in this topology.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: insurance-ai-backend
    restart: unless-stopped
    environment:
      # Internal-network hostnames/ports (postgres:5432, kafka:9092) - never the host-mapped
      # 5433/9094 used by tools running outside this compose network.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-insurance_ai}
      POSTGRES_USER: ${POSTGRES_USER:-insurance_ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-insurance_ai}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Defaults to the deterministic fake provider - no real OpenAI/Anthropic credentials
      # required to run the full product end to end. Override via a real .env for a real provider.
      INSURANCE_AI_PROVIDER: ${INSURANCE_AI_PROVIDER:-fake}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-not-configured}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-configured}
    ports:
      # Published for direct developer access (Swagger UI, curl) - real network segmentation
      # (removing this and routing every external call through the gateway/WAF only) is FASE 40's
      # concern, see docs/architecture/NETWORK_SEGMENTATION.md.
      - "8080:8080"
    networks:
      - insurance-ai-net
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: insurance-ai-gateway
    restart: unless-stopped
    environment:
      INSURANCE_AI_BACKEND_URI: http://backend:8080
      # The browser-facing origin of the frontend container (host-mapped port, not the internal
      # Docker network address - CORS is enforced against what the browser itself sends as
      # `Origin`).
      INSURANCE_AI_ALLOWED_ORIGIN: ${INSURANCE_AI_ALLOWED_ORIGIN:-http://localhost:8083}
    ports:
      - "8082:8082"
    networks:
      - insurance-ai-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8082/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: insurance-ai-frontend
    restart: unless-stopped
    environment:
      # The one thing the frontend is allowed to know (brief section 47) - the gateway's
      # browser-reachable URL, injected into env.js at container startup. Never a database URL,
      # Kafka URL, LLM credential, or internal service hostname.
      PUBLIC_API_BASE_URL: ${INSURANCE_AI_PUBLIC_API_BASE_URL:-http://localhost:8082}
    ports:
      - "8083:8080"
    networks:
      - insurance-ai-net
    depends_on:
      gateway:
        condition: service_healthy

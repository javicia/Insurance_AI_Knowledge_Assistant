# Shared by every `location` block in nginx.conf (see that file's comment for why this must be
# `include`d per-location rather than declared once at the `server` level).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# Generated at container startup by docker-entrypoint.sh (connect-src needs the real
# PUBLIC_API_BASE_URL) - see that script and docs/security/FRONTEND_SECURITY.md.
include /etc/nginx/conf.d/csp-header.conf;

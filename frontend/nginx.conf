# Static-only server (FASE 16 separation): no /api proxy_pass here - the browser calls the
# gateway's PUBLIC_API_BASE_URL directly (see docs/architecture diagrams), this container only
# ever serves the compiled Angular bundle. Security headers here are the frontend's own baseline
# (docs/security/FRONTEND_SECURITY.md documents which headers belong here vs. at the WAF/gateway).
#
# IMPORTANT nginx gotcha, found and fixed empirically (curl against the real running container
# showed every security header silently missing, not just CSP): `add_header` directives are only
# inherited into a `location` block from its parent `server` block if that `location` defines NO
# `add_header` of its own. Every `location` block below already sets its own `Cache-Control` via
# `add_header` - which means none of them would inherit the server-level security headers if those
# were only declared once at the `server` level (the original, buggy version of this file). Fixed
# by `include`-ing one shared snippet (`security-headers.conf`) in every `location` block, rather
# than relying on inheritance at all.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html itself - it references hashed asset filenames that change on every
    # build; caching it would serve a stale app shell pointing at assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/includes/security-headers.conf;
    }

    # env.js is regenerated by docker-entrypoint.sh on every container start - must never be
    # cached by the browser, or a redeployed container with a different PUBLIC_API_BASE_URL would
    # appear to keep talking to the old one.
    location = /env.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/includes/security-headers.conf;
    }

    # Hashed build artifacts (main-<hash>.js, styles-<hash>.css, chunk-<hash>.js) are safe to cache
    # aggressively - a new build always produces a new filename.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/includes/security-headers.conf;
    }

    # SPA fallback: any path Angular's router owns (e.g. /assistant, /documents) must resolve to
    # index.html so the client-side router can take over - this container has no concept of
    # /api/** (that never reaches it, see the architecture diagram), so there is no equivalent of
    # the old backend-side SpaWebConfiguration API-vs-fallback distinction to make here.
    location / {
        try_files $uri $uri/ /index.html;
        include /etc/nginx/includes/security-headers.conf;
    }
}

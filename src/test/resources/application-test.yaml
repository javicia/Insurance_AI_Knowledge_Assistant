# Test-only overrides, layered on top of src/main/resources/application.yaml (profile-specific
# files are additive/merge, never a full replacement - see docs/testing/TESTCONTAINERS.md).
# Activated by @ActiveProfiles("test") on every @SpringBootTest class so they all share one
# Spring TestContext cache key, and therefore one shared Postgres + one shared Kafka container
# pair for the whole suite within a single Maven invocation.
insurance-ai:
  ai:
    # No automated test may require real OpenAI/Anthropic credentials (brief FASE 5 section 29) -
    # "fake" is a safe, harmless default for the ~7 test classes that never touch the RAG/LLM
    # subsystem at all, and is exactly what RagPipelineIntegrationTest already needed.
    provider: fake
  rag:
    semantic:
      # Test-only override of the fake embedding provider's similarity distribution - never the
      # production value (application.yaml keeps 0.75 untouched). See docs/rag/HYBRID_SEARCH.md
      # and RagPipelineIntegrationTest's Javadoc for the full rationale.
      similarity-threshold: 0.5
